name: Build Android APK 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Prepare web assets and Capacitor
        run: |
          mkdir -p www assets
          cp index.html www/fallback.html
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <style>
              body { background: #020617; color: #94a3b8; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
              .spinner { width: 32px; height: 32px; border: 3px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <div id="status">Запуск Gemini Agents...</div>
            <script>
              const REMOTE_PAGE = "https://zhukaa.github.io/my-gemini-agents/?v=" + Date.now();
              const fallbackTimer = setTimeout(() => {
                document.getElementById("status").textContent = "Запуск локальной версии...";
                window.location.replace("fallback.html");
              }, 2500);

              if (navigator.onLine) {
                window.location.replace(REMOTE_PAGE);
              } else {
                clearTimeout(fallbackTimer);
                window.location.replace("fallback.html");
              }
            </script>
          </body>
          </html>
          EOF

          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
          fi

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/filesystem @capacitor/share
          npx cap init "Gemini Agents" "com.zhukaa.geminiagents" --web-dir=www
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.backgroundColor = "#020617";
            cfg.server = {
              androidScheme: "https",
              allowNavigation: [
                "zhukaa.github.io",
                "*.github.io",
                "*.firebaseapp.com",
                "*.googleapis.com",
                "*.gstatic.com",
                "*.workers.dev"
              ]
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android
          npx cap sync android

          if [ -f assets/icon.png ]; then
            npx capacitor-assets generate --android --iconBackgroundColor '#020617' --iconBackgroundColorDark '#020617'
          fi

          echo 'dependencies { implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")) }' >> android/app/build.gradle
          sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAgents-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk